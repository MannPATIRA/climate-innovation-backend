name: Build, Test & Deploy (CD)

on:
  push:
    branches: [ "main" ]

jobs:
  build_test_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      # Now the Deploy step
      - name: Deploy to Railway
        if: success()  # only deploy if tests pass
        run: |
          echo "Deploying to Railway..."

          # Option 1: If you rely on Railway's built-in GitHub Integration
          #   You don't actually need a manual step here: 
          #   connecting your GitHub repo in Railway automatically triggers deployments 
          #   after successful pushes to 'main'.
          
          # Option 2: If you prefer to script it with the Railway CLI:
          #   1) Install the CLI
          #   npm install -g @railway/cli
          #   2) Log in with a token (set in GitHub secrets)
          #   railway login --token ${{ secrets.RAILWAY_TOKEN }}
          #   3) Deploy
          #   railway up
